{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UG Hydrogen Fuel Racing{% endblock %}</title>
    <meta name="description" content="UG Hydrogen Fuel Racing: the University of Glasgow's student team building hydrogen fuel cell vehicles for land, sea and air, competing at the Shell Eco-Marathon and the Monaco Energy Boat Challenge.">
    <link rel="icon" href="{% static 'core/hfr.jpg' %}">
    <link rel="stylesheet" href="{% static 'core/shared.css' %}?v=15">
    <link rel="stylesheet" href="{% static 'core/hfr-sidebar.css' %}?v=15">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include 'core/includes/navbar.html' %}
    {% block body %}{% endblock %}
    <script src="{% static 'core/hfr-sidebar.js' %}?v=15"></script>
    <script src="{% static 'core/shared.js' %}?v=15"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
