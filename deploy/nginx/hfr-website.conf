# /etc/nginx/sites-available/hfr-website
# install.sh replaces __DOMAIN__ with the real domain. Certbot adds the TLS
# server block and the http->https redirect when it runs.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 10m;   # CV uploads are capped at 5 MB by the app

    # Uploaded avatars, served straight from disk
    location /media/ {
        alias /srv/hfr-website/media/;
        expires 7d;
    }

    # Everything else (static files come from WhiteNoise inside the app)
    location / {
        proxy_pass http://unix:/run/hfr-website/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
